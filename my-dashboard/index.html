<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人消费记账看板</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 380px; }
    #status { display: none; }
    .card { cursor: default; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">个人消费记账看板</h1>
    <p class="text-muted mb-1" id="sub-title">2026年上半年 · 单位：元</p>
    <p class="text-muted small" id="source-note">数据来源：本人记账App导出（课堂模拟数据）</p>
  </header>

  <p id="status" class="alert alert-warning">
    <span id="status-text"></span>
    <button id="retry-btn" class="btn btn-sm btn-primary ms-2" style="display:none;">重试</button>
  </p>

  <section class="row g-3 mb-4" id="cards"></section>

  <!-- jQuery 交互：按品类筛选柱状图 -->
  <div class="d-flex align-items-center gap-2 mb-2">
    <span class="text-muted small">筛选品类：</span>
    <div id="category-filters" class="btn-group btn-group-sm" role="group"></div>
  </div>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各月分类支出（ECharts柱状图，单位：元）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2>月度总支出趋势（Chart.js折线图，单位：元）</h2>
      <div class="chart-box"><canvas id="line-chart"></canvas></div>
    </div>
  </section>

  <section class="row g-3 mt-1">
    <div class="col-lg-6">
      <h2 class="h5">上半年各类支出占比（ECharts饼图）</h2>
      <div id="pie-chart" class="chart-box"></div>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
